<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeones de League of Legends</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar border-bottom">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Campeones de LoL</span>
            <span class="navbar-text small" id="contador"></span>
        </div>
    </nav>

    <main class="container my-4">
        <h1 class="text-center mb-1">Campeones</h1>
        <p class="text-center text-body-secondary mb-4">Datos de Data Dragon, versión 14.3.1</p>

        <div id="filtros" class="d-flex flex-wrap justify-content-center gap-2 mb-4"></div>

        <div id="error" class="alert alert-danger d-none" role="alert"></div>

        
        <div id="grilla" class="row g-3"></div>


        <div class="text-center my-4">
            <button id="botonVerMas" class="btn btn-outline-warning d-none">Ver mas campeones</button>
        </div>
    </main>

    <footer class="text-center text-body-secondary small py-4 border-top">
        Plataformas Moviles Ultimo Tp
    </footer>

    <div class="modal fade" id="modalCampeon" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title fs-4" id="modalTitulo"></h2>
                        <div class="text-body-secondary" id="modalSubtitulo"></div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <div class="col-md-4 text-center">
                            <img id="modalImg" class="img-fluid rounded" alt="">
                        </div>
                        <div class="col-md-8">
                            <p id="modalDescripcion"></p>
                            <p id="modalRoles"></p>
                            <p class="mb-1" id="modalAtaque"></p>
                            <p class="mb-1" id="modalDefensa"></p>
                            <p class="mb-1" id="modalMagia"></p>
                            <p class="mb-1" id="modalDificultad"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
